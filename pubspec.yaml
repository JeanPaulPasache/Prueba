name: my_flutter_app # Puedes cambiar el nombre de tu aplicación
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Asegúrate de que esta versión coincida con tu SDK de Flutter

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2 # Un paquete de iconos de iOS

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0 # Herramientas de análisis de código

flutter:
  uses-material-design: true
